<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Count Scanner</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#14181f;--mut:#667085;--bd:#e3e6eb;--ac:#0a7c4a;--acx:#fff;--dg:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101317;--card:#1a1f26;--tx:#eef1f5;--mut:#98a2b3;--bd:#2b323c;--ac:#2fbf80;--acx:#06210f;--dg:#ef6b6b}}
:root[data-theme="dark"]{--bg:#101317;--card:#1a1f26;--tx:#eef1f5;--mut:#98a2b3;--bd:#2b323c;--ac:#2fbf80;--acx:#06210f;--dg:#ef6b6b}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.step{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input{width:100%;font-size:18px;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
button{font:600 16px inherit;font-family:inherit;border:0;border-radius:10px;padding:13px 16px;background:var(--ac);color:var(--acx);cursor:pointer}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
button.full{width:100%}
.row{display:flex;gap:8px}
.row>*{flex:1}
#reader{width:100%;border-radius:10px;overflow:hidden;margin-top:10px}
.qty{display:flex;gap:8px;align-items:center}
.qty button{width:52px;flex:none;padding:12px 0;font-size:22px}
.qty input{text-align:center}
.msg{font-size:14px;color:var(--mut);margin-top:8px;min-height:20px}
.list{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--bd);white-space:nowrap}
td.x{color:var(--dg);cursor:pointer;font-weight:700}
.tot{font-size:13px;color:var(--mut);margin:0 0 8px}
</style>
</head>
<body>
<main>
<h1>Stock Count Scanner</h1>

<div class="card">
  <div class="step">Step 1 · Barcode</div>
  <div class="row">
    <button id="scanBtn">Scan with camera</button>
    <button id="stopBtn" class="sec" style="display:none">Stop camera</button>
  </div>
  <div id="reader"></div>
  <label for="code">Barcode (or type it)</label>
  <input id="code" inputmode="numeric" autocomplete="off" placeholder="Scan or type barcode">
</div>

<div class="card">
  <div class="step">Step 2 · Expiry date</div>
  <input id="exp" inputmode="numeric" maxlength="10" placeholder="YYYY-MM-DD" autocomplete="off">
</div>

<div class="card">
  <div class="step">Step 3 · Quantity</div>
  <div class="qty">
    <button class="sec" id="minus">−</button>
    <input id="qty" type="number" inputmode="numeric" min="1" value="1">
    <button class="sec" id="plus">+</button>
  </div>
  <div class="msg" id="msg"></div>
  <button class="full" id="saveBtn" style="margin-top:6px">Save item</button>
</div>

<div class="card">
  <div class="step">Counted items</div>
  <p class="tot" id="tot"></p>
  <p class="tot" id="stat"></p>
  <div class="list"><table><thead><tr><th>Barcode</th><th>Expiry</th><th>Qty</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
  <div class="row" style="margin-top:12px">
    <button id="xlsBtn">Export Excel</button>
    <button id="clrBtn" class="sec">Clear all</button>
  </div>
</div>
</main>

<script>
(function(){
  var KEY="stockcount.items.v1", items=[], scanner=null;
  var $=function(i){return document.getElementById(i)};
  try{ items=JSON.parse(localStorage.getItem(KEY)||"[]"); }catch(e){ items=[]; }
  function persist(){ try{ localStorage.setItem(KEY,JSON.stringify(items)); $("stat").textContent="✓ Saved on this phone ("+items.length+" lines)"; }catch(e){ $("stat").textContent="⚠ Cannot save in this browser (private mode?). Export Excel now!"; } }
  function say(t){ $("msg").textContent=t; }

  function render(){
    var tb=$("rows"); tb.innerHTML="";
    var total=0;
    items.forEach(function(it,i){
      total+=it.qty;
      var tr=document.createElement("tr");
      [it.code,it.exp,it.qty].forEach(function(v){ var td=document.createElement("td"); td.textContent=v; tr.appendChild(td); });
      var x=document.createElement("td"); x.className="x"; x.textContent="✕";
      x.onclick=function(){ if(confirm("Delete this line?")){ items.splice(i,1); persist(); render(); } };
      tr.appendChild(x); tb.appendChild(tr);
    });
    $("tot").textContent=items.length+" lines · "+total+" units";
  }

  function stopCam(){
    if(!scanner) return;
    var s=scanner; scanner=null;
    s.stop().then(function(){ s.clear(); }).catch(function(){});
    $("stopBtn").style.display="none"; $("scanBtn").style.display="";
  }

  $("scanBtn").onclick=function(){
    if(typeof Html5Qrcode==="undefined"){ say("Scanner library did not load. Type the barcode instead."); return; }
    scanner=new Html5Qrcode("reader");
    $("scanBtn").style.display="none"; $("stopBtn").style.display="";
    scanner.start({facingMode:"environment"},{fps:10,qrbox:{width:260,height:140}},
      function(text){
        $("code").value=text; say("Scanned: "+text);
        if(navigator.vibrate) navigator.vibrate(80);
        stopCam(); $("exp").focus();
      },function(){}
    ).catch(function(e){
      say("Camera unavailable ("+(e&&e.message?e.message:e)+"). Type the barcode instead.");
      scanner=null; $("stopBtn").style.display="none"; $("scanBtn").style.display="";
    });
  };
  $("stopBtn").onclick=stopCam;

  $("exp").oninput=function(){
    var v=this.value.replace(/\D/g,"").slice(0,8);
    if(v.length>6) v=v.slice(0,4)+"-"+v.slice(4,6)+"-"+v.slice(6);
    else if(v.length>4) v=v.slice(0,4)+"-"+v.slice(4);
    this.value=v;
  };

  $("minus").onclick=function(){ $("qty").value=Math.max(1,(+$("qty").value||1)-1); };
  $("plus").onclick=function(){ $("qty").value=(+$("qty").value||0)+1; };

  $("saveBtn").onclick=function(){
    var code=$("code").value.trim(), exp=$("exp").value, qty=parseInt($("qty").value,10);
    if(!code){ say("Scan or type a barcode first."); return; }
    var m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(exp), d=m&&new Date(+m[1],m[2]-1,+m[3]);
    if(!d||d.getMonth()!==m[2]-1){ say("Type the expiry as year-month-day, e.g. 2026-12-31."); return; }
    if(!(qty>0)){ say("Enter a quantity."); return; }
    var found=items.filter(function(it){return it.code===code&&it.exp===exp})[0];
    if(found){ found.qty+=qty; say("Added to existing line (same barcode and expiry)."); }
    else{ items.push({code:code,exp:exp,qty:qty}); say("Saved."); }
    persist(); render();
    $("code").value=""; $("exp").value=""; $("qty").value=1;
  };

  $("xlsBtn").onclick=async function(){
    if(!items.length){ say("Nothing to export yet."); return; }
    if(typeof XLSX==="undefined"){ say("Excel library did not load."); return; }
    var rows=[["Barcode","Expiry date","Quantity"]].concat(items.map(function(it){return [it.code,it.exp,it.qty]}));
    var ws=XLSX.utils.aoa_to_sheet(rows); ws["!cols"]=[{wch:18},{wch:14},{wch:10}];
    var wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,"Stock count");
    var buf=XLSX.write(wb,{bookType:"xlsx",type:"array"});
    var blob=new Blob([buf],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"});
    var fname="stock-count-"+new Date().toISOString().slice(0,10)+".xlsx";
    try{
      var dl=window.claude&&await window.claude.use("downloads");
      if(dl){ await dl.save({filename:fname,data:blob}); say("Exported."); return; }
    }catch(e){ if(e&&e.code==="declined"){ say("Export cancelled."); return; } }
    try{ XLSX.writeFile(wb,fname); say("Exported."); }catch(e){ say("Export failed."); }
  };

  $("clrBtn").onclick=function(){
    if(items.length&&confirm("Delete ALL counted items? Export first!")){ items=[]; persist(); render(); }
  };

  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(function(){}); }catch(e){}
  persist();
  render();
})();
</script>
</body>
</html>
